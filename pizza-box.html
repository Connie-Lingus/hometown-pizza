<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#FDF8F3">
  <title>My Pizza Box — Hometown Pizza</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <style>
    :root {
      --red: #C8311A; --red-light: #FAECE7; --red-dark: #7A1D0E;
      --cream: #FDF8F3; --dark: #1A1410; --border: #E8DDD6; --muted: #9A8E88;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; background: var(--cream); }
    body { font-family: -apple-system, 'SF Pro Display', 'Helvetica Neue', system-ui, sans-serif; -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; }

    /* HEADER */
    .header { position: fixed; top: 0; left: 0; right: 0; z-index: 100; background: var(--cream); border-bottom: 1px solid var(--border); padding: 0 16px; padding-top: var(--safe-top); height: calc(56px + var(--safe-top)); display: flex; align-items: flex-end; justify-content: space-between; padding-bottom: 10px; }
    .back-btn { display: flex; align-items: center; gap: 6px; color: var(--dark); font-size: 15px; font-weight: 600; text-decoration: none; border: none; background: transparent; cursor: pointer; font-family: inherit; }
    .back-btn i { font-size: 20px; }
    .header-img { width: 44px; height: 44px; object-fit: contain; }
    .group-btn { display: flex; align-items: center; gap: 5px; color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: 0.5px; text-decoration: none; border: 1.5px solid var(--border); border-radius: 20px; padding: 5px 10px; background: transparent; cursor: pointer; font-family: inherit; }
    .group-btn i { font-size: 15px; }
    .soon-pill { background: var(--border); color: var(--muted); font-size: 9px; font-weight: 800; border-radius: 8px; padding: 2px 6px; letter-spacing: 0.5px; white-space: nowrap; }

    /* PAGE BODY — padded for header + checkout bar + nav */
    .page-body { flex: 1; padding-top: calc(56px + var(--safe-top)); padding-bottom: calc(180px + var(--safe-bottom)); overflow-y: auto; }

    /* EMPTY STATE */
    .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 60px 32px; text-align: center; min-height: 60vh; }
    .sad-chef { width: 220px; height: auto; margin-bottom: 24px; }
    .empty-title { font-size: 24px; font-weight: 800; color: var(--dark); letter-spacing: -0.6px; margin-bottom: 8px; }
    .empty-sub { font-size: 16px; font-weight: 600; color: var(--muted); margin-bottom: 32px; }
    .start-btn { display: inline-flex; align-items: center; gap: 8px; padding: 16px 28px; border-radius: 14px; background: var(--red); color: #fff; font-size: 16px; font-weight: 700; text-decoration: none; border: none; cursor: pointer; font-family: inherit; }
    .start-btn:active { background: var(--red-dark); }

    /* ITEMS */
    .items-wrap { padding: 20px 16px; display: flex; flex-direction: column; gap: 12px; }
    .box-item { background: #fff; border-radius: 14px; border: 1.5px solid var(--border); padding: 16px; }
    .box-item-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
    .box-item-name { font-size: 16px; font-weight: 800; color: var(--dark); letter-spacing: -0.3px; }
    .box-item-price { font-size: 18px; font-weight: 800; color: var(--red); flex-shrink: 0; margin-left: 12px; }
    .box-item-detail { font-size: 12px; color: var(--muted); line-height: 1.6; }
    .box-item-detail span { display: block; }
    .box-item-footer { display: flex; justify-content: flex-end; margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--border); }
    .item-remove-btn { font-size: 12px; font-weight: 700; color: var(--red); background: transparent; border: 1.5px solid var(--red); border-radius: 20px; padding: 5px 12px; cursor: pointer; font-family: inherit; }
    .item-remove-btn:active { background: var(--red-light); }

    /* ADD ANOTHER */
    .add-another { display: flex; align-items: center; gap: 10px; padding: 16px; border-radius: 14px; border: 1.5px dashed var(--border); background: transparent; color: var(--muted); font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit; text-decoration: none; width: 100%; justify-content: center; transition: all 0.15s; }
    .add-another:active { border-color: var(--dark); color: var(--dark); }
    .add-another i { font-size: 20px; }

    /* ORDER TOTAL */
    .order-total { margin: 0 16px; padding: 16px; background: #fff; border-radius: 14px; border: 1.5px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .order-total-label { font-size: 15px; font-weight: 700; color: var(--dark); }
    .order-total-amount { font-size: 24px; font-weight: 800; color: var(--dark); letter-spacing: -0.5px; }

    /* CHECKOUT BAR — sits above bottom nav */
    .checkout-bar {
      position: fixed;
      bottom: calc(56px + var(--safe-bottom));
      left: 0; right: 0;
      padding: 12px 16px;
      background: var(--cream);
      border-top: 1px solid var(--border);
      z-index: 101;
    }
    .checkout-btn { width: 100%; padding: 18px; border-radius: 14px; background: var(--red); color: #fff; font-size: 17px; font-weight: 700; border: none; cursor: pointer; font-family: inherit; display: flex; align-items: center; justify-content: center; gap: 8px; transition: background 0.15s; }
    .checkout-btn:active { background: var(--red-dark); }

    /* BOTTOM NAV — z-index BELOW checkout bar */
    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; z-index: 100; background: var(--cream); border-top: 1px solid var(--border); display: flex; align-items: stretch; height: calc(56px + var(--safe-bottom)); padding-bottom: var(--safe-bottom); }
    .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; cursor: pointer; border: none; background: transparent; font-family: inherit; transition: all 0.15s; text-decoration: none; color: var(--muted); padding: 6px 0; }
    .nav-item:active { opacity: 0.7; }
    .nav-item.active { color: var(--red); }
    .nav-item i { font-size: 22px; }
    .nav-label { font-size: 10px; font-weight: 600; letter-spacing: 0.3px; }
    .nav-box-img { width: 26px; height: 26px; object-fit: contain; opacity: 0.5; }
    .nav-item.active .nav-box-img { opacity: 1; }
    .nav-badge { position: absolute; top: -3px; right: -5px; background: var(--red); color: #fff; font-size: 9px; font-weight: 800; border-radius: 10px; padding: 2px 4px; min-width: 14px; text-align: center; }
  </style>
</head>
<body>

  <!-- HEADER -->
  <div class="header">
    <a href="index.html" class="back-btn"><i class="ti ti-arrow-left"></i> Menu</a>
    <img src="images/Pizza_Box_2-nobg.png" alt="My Pizza Box" class="header-img">
    <button class="group-btn" title="Group Order — Coming Soon">
      <i class="ti ti-users"></i> Group Order <span class="soon-pill">Soon</span>
    </button>
  </div>

  <!-- PAGE BODY -->
  <div class="page-body" id="page-body">

    <!-- EMPTY STATE -->
    <div class="empty-state" id="empty-state">
      <img src="images/fat_chef_empty_box-nobg.png" alt="Empty Box" class="sad-chef">
      <div class="empty-title">YOUR PIZZA BOX IS EMPTY.</div>
      <div class="empty-sub">That is so sad.</div>
      <a href="index.html#menu" class="start-btn">
        <i class="ti ti-pizza" style="font-size:20px"></i>
        Order Now
      </a>
    </div>

    <!-- ITEMS VIEW -->
    <div id="items-view" style="display:none">
      <div class="items-wrap" id="items-list"></div>
      <div class="items-wrap" style="padding-top:0">
        <a href="index.html#menu" class="add-another">
          <i class="ti ti-circle-plus"></i> Add Another Item
        </a>
      </div>
      <div class="order-total" id="order-total">
        <span class="order-total-label">Order Total</span>
        <span class="order-total-amount" id="total-amount">$0.00</span>
      </div>
    </div>

  </div>

  <!-- CHECKOUT BAR — above nav -->
  <div class="checkout-bar" id="checkout-bar" style="display:none">
    <button class="checkout-btn" onclick="window.location.href='checkout.html'">
      <i class="ti ti-lock" style="font-size:20px"></i>
      Proceed to Checkout — $<span id="checkout-total">0.00</span>
    </button>
  </div>

  <!-- BOTTOM NAV -->
  <nav class="bottom-nav">
    <a href="index.html" class="nav-item"><i class="ti ti-home"></i><span class="nav-label">Home</span></a>
    <a href="index.html#menu" class="nav-item"><i class="ti ti-menu-2"></i><span class="nav-label">Menu</span></a>
    <a href="pizza-box.html" class="nav-item active" style="position:relative">
      <div style="position:relative;display:inline-flex">
        <img src="images/Pizza_Box_2-nobg.png" alt="My Box" class="nav-box-img">
        <span class="nav-badge" id="nav-box-badge" style="display:none">0</span>
      </div>
      <span class="nav-label">My Box</span>
    </a>
  </nav>

  <script>
    function loadBox() {
      try { return JSON.parse(localStorage.getItem('htp_box') || '[]'); }
      catch(e) { return []; }
    }

    function saveBox(box) { localStorage.setItem('htp_box', JSON.stringify(box)); }

    function render() {
      const box = loadBox();
      const emptyState   = document.getElementById('empty-state');
      const itemsView    = document.getElementById('items-view');
      const checkoutBar  = document.getElementById('checkout-bar');
      const itemsList    = document.getElementById('items-list');
      const badge        = document.getElementById('nav-box-badge');

      // Update badge
      if (badge) {
        if (box.length > 0) { badge.textContent = box.length; badge.style.display = 'block'; }
        else { badge.style.display = 'none'; }
      }

      if (box.length === 0) {
        emptyState.style.display  = 'flex';
        itemsView.style.display   = 'none';
        checkoutBar.style.display = 'none';
        return;
      }

      emptyState.style.display  = 'none';
      itemsView.style.display   = 'block';
      checkoutBar.style.display = 'block';
      itemsList.innerHTML = '';

      let total = 0;
      box.forEach((item, idx) => {
        total += item.price || 0;
        const details = [];
        if (item.crust)   details.push(item.crust + ' crust');
        if (item.sauce)   details.push(item.sauce);
        if (item.cheese)  details.push(item.cheese);
        if (item.toppings && item.toppings.length) details.push(item.toppings.join(', '));
        if (item.details) details.push(...item.details);

        const card = document.createElement('div');
        card.className = 'box-item';
        card.innerHTML = `
          <div class="box-item-header">
            <div class="box-item-name">${item.display || item.name}</div>
            <div class="box-item-price">$${(item.price||0).toFixed(2)}</div>
          </div>
          <div class="box-item-detail">
            ${details.map(d => `<span>${d}</span>`).join('')}
          </div>
          <div class="box-item-footer">
            <button class="item-remove-btn" onclick="removeItem(${idx})">
              <i class="ti ti-x" style="font-size:11px"></i> Remove
            </button>
          </div>`;
        itemsList.appendChild(card);
      });

      document.getElementById('total-amount').textContent   = '$' + total.toFixed(2);
      document.getElementById('checkout-total').textContent = total.toFixed(2);
    }

    function removeItem(idx) {
      const box = loadBox();
      box.splice(idx, 1);
      saveBox(box);
      render();
    }

    render();
  </script>

</body>
</html>
