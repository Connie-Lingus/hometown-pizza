<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#FDF8F3">
  <title>Baked Pasta — Hometown Pizza</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <style>
    :root {
      --red: #C8311A; --red-light: #FAECE7; --red-dark: #7A1D0E;
      --cream: #FDF8F3; --dark: #1A1410; --border: #E8DDD6; --muted: #9A8E88;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; background: var(--cream); }
    body { font-family: -apple-system, 'SF Pro Display', 'Helvetica Neue', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }

    .header { position: fixed; top: 0; left: 0; right: 0; z-index: 100; background: var(--cream); border-bottom: 1px solid var(--border); padding: 0 16px; padding-top: var(--safe-top); height: calc(56px + var(--safe-top)); display: flex; align-items: flex-end; justify-content: space-between; padding-bottom: 10px; }
    .back-btn { display: flex; align-items: center; gap: 6px; color: var(--dark); font-size: 15px; font-weight: 600; text-decoration: none; }
    .back-btn i { font-size: 20px; }
    .header-title { font-size: 17px; font-weight: 800; color: var(--dark); letter-spacing: -0.4px; }
    .header-spacer { width: 60px; }

    .page-body { padding-top: calc(56px + var(--safe-top)); padding-bottom: calc(100px + var(--safe-bottom)); }
    .page-eyebrow { font-size: 11px; font-weight: 700; color: var(--red); letter-spacing: 1.8px; text-transform: uppercase; padding: 24px 16px 4px; }
    .page-title { font-size: 26px; font-weight: 800; color: var(--dark); letter-spacing: -0.6px; padding: 0 16px 4px; }
    .page-sub { font-size: 12px; color: var(--muted); padding: 0 16px 16px; }

    .item-list { display: flex; flex-direction: column; gap: 10px; padding: 0 16px; }
    .item-card { background: #fff; border-radius: 14px; border: 1.5px solid var(--border); overflow: hidden; transition: border-color 0.15s; }
    .item-card.in-box { border-color: var(--red); background: var(--red-light); }

    .item-face { display: flex; align-items: center; gap: 12px; padding: 14px 16px; cursor: pointer; min-height: 70px; }
    .item-face:active { opacity: 0.85; }
    .item-info { flex: 1; }
    .item-name { font-size: 15px; font-weight: 700; color: var(--dark); }
    .item-card.in-box .item-name { color: var(--red-dark); }
    .item-desc { font-size: 12px; color: var(--muted); margin-top: 3px; line-height: 1.4; }
    .item-right { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; flex-shrink: 0; }
    .item-price { font-size: 16px; font-weight: 800; color: var(--dark); }
    .item-card.in-box .item-price { color: var(--red); }
    .add-badge { font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 20px; background: var(--red); color: #fff; }
    .popular-badge { font-size: 10px; font-weight: 700; background: var(--red); color: #fff; border-radius: 6px; padding: 2px 7px; margin-left: 7px; vertical-align: middle; }

    .item-options { display: none; padding: 0 14px 14px; border-top: 1px solid var(--border); }
    .item-options.show { display: block; }

    .opt-label { font-size: 10px; font-weight: 700; color: var(--muted); letter-spacing: 1.2px; text-transform: uppercase; margin: 12px 0 8px; }
    .opt-divider { height: 1px; background: var(--border); margin: 10px 0; }

    /* SAUCE TOGGLE */
    .choice-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .choice-btn { padding: 8px 18px; border-radius: 20px; border: 1.5px solid var(--border); background: #fff; font-size: 13px; font-weight: 700; color: var(--muted); cursor: pointer; font-family: inherit; transition: all 0.15s; }
    .choice-btn.active { background: var(--dark); color: #fff; border-color: var(--dark); }
    .choice-btn:active { opacity: 0.8; }

    /* ADDON ROW */
    .addon-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; }
    .addon-left { flex: 1; }
    .addon-name { font-size: 13px; font-weight: 600; color: var(--dark); }
    .addon-price { font-size: 12px; color: var(--muted); margin-top: 2px; }

    /* COUNTER */
    .counter { display: flex; align-items: center; gap: 10px; }
    .counter-btn { width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid var(--border); background: #fff; font-size: 18px; font-weight: 700; color: var(--dark); cursor: pointer; font-family: inherit; display: flex; align-items: center; justify-content: center; transition: all 0.15s; line-height: 1; }
    .counter-btn:active { background: var(--border); }
    .counter-val { font-size: 16px; font-weight: 800; color: var(--dark); min-width: 20px; text-align: center; }

    /* TOGGLE ADDON (meatballs) */
    .toggle-btn { padding: 7px 16px; border-radius: 20px; border: 1.5px solid var(--border); background: #fff; font-size: 13px; font-weight: 700; color: var(--muted); cursor: pointer; font-family: inherit; transition: all 0.15s; }
    .toggle-btn.active { background: var(--dark); color: #fff; border-color: var(--dark); }
    .toggle-btn:active { opacity: 0.8; }

    .included-note { font-size: 11px; color: var(--muted); font-style: italic; padding: 4px 0; }

    .add-btn { width: 100%; padding: 12px; border-radius: 12px; border: none; background: var(--red); color: #fff; font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit; margin-top: 12px; display: flex; align-items: center; justify-content: center; gap: 6px; transition: background 0.15s; }
    .add-btn:active { background: var(--red-dark); }
    .remove-btn { width: 100%; padding: 12px; border-radius: 12px; border: 1.5px solid var(--red); background: transparent; color: var(--red); font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit; margin-top: 12px; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .remove-btn:active { background: var(--red-light); }

    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; z-index: 100; background: var(--cream); border-top: 1px solid var(--border); display: flex; align-items: stretch; height: calc(56px + var(--safe-bottom)); padding-bottom: var(--safe-bottom); }
    .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; cursor: pointer; border: none; background: transparent; font-family: inherit; transition: all 0.15s; text-decoration: none; color: var(--muted); padding: 6px 0; }
    .nav-item:active { opacity: 0.7; }
    .nav-item i { font-size: 22px; }
    .nav-label { font-size: 10px; font-weight: 600; letter-spacing: 0.3px; }
    .nav-box-img { width: 26px; height: 26px; object-fit: contain; opacity: 0.5; }
    .nav-badge { position: absolute; top: -3px; right: -5px; background: var(--red); color: #fff; font-size: 9px; font-weight: 800; border-radius: 10px; padding: 2px 4px; min-width: 14px; text-align: center; }
  </style>
</head>
<body>

  <div class="header">
    <a href="index.html#menu" class="back-btn"><i class="ti ti-arrow-left"></i> Menu</a>
    <div class="header-title">Baked Pasta</div>
    <div class="header-spacer"></div>
  </div>

  <div class="page-body">
    <div class="page-eyebrow">Oven Baked</div>
    <div class="page-title">Baked Pasta</div>
    <div class="page-sub">All dishes served with garlic toast &nbsp;·&nbsp; Extra garlic toast +$0.75</div>
    <div class="item-list" id="item-list"></div>
  </div>

  <nav class="bottom-nav">
    <a href="index.html" class="nav-item"><i class="ti ti-home"></i><span class="nav-label">Home</span></a>
    <a href="index.html#menu" class="nav-item"><i class="ti ti-menu-2"></i><span class="nav-label">Menu</span></a>
    <a href="pizza-box.html" class="nav-item" style="position:relative">
      <div style="position:relative;display:inline-flex">
        <img src="images/Pizza_Box_2-nobg.png" alt="My Box" class="nav-box-img">
        <span class="nav-badge" id="nav-box-badge" style="display:none">0</span>
      </div>
      <span class="nav-label">My Box</span>
    </a>
  </nav>

  <script>
    const EXTRA_TOAST_PRICE    = 0.75;
    const MEATBALL_PRICE       = 2.00;

    // sauceSwap: array of options (first is default)
    // hasMeatballs: already included
    // canAddMeatballs: show meatball add-on
    const ITEMS = [
      {
        id: 'spaghetti',
        name: 'Spaghetti',
        desc: 'Baked and topped with your choice of sauce and mozzarella cheese. Served with garlic toast.',
        price: 9.99,
        popular: true,
        sauceSwap: ['Marinara', 'Alfredo'],
        canAddMeatballs: true
      },
      {
        id: 'spaghetti-meatballs',
        name: 'Spaghetti with Meatballs',
        desc: 'Baked spaghetti with mozzarella cheese and two beef meatballs. Served with garlic toast.',
        price: 11.49,
        popular: true,
        sauceSwap: ['Marinara', 'Alfredo'],
        hasMeatballs: true
      },
      {
        id: 'spaghetti-alfredo',
        name: 'Spaghetti Alfredo with Chicken',
        desc: 'Spaghetti in a rich alfredo sauce with grilled chicken and mozzarella. Served with garlic toast.',
        price: 11.49,
        popular: false,
        fixedSauce: 'Alfredo'
      },
      {
        id: 'white-cheddar-mac',
        name: 'White Cheddar Mac',
        desc: 'White cheddar macaroni and bacon topped with toasted bread crumbs. Served with garlic toast.',
        price: 10.99,
        popular: true,
        canAddMeatballs: true
      }
    ];

    const state = {};
    ITEMS.forEach(item => {
      state[item.id] = {
        inBox: false,
        sauce: item.sauceSwap ? item.sauceSwap[0] : (item.fixedSauce || null),
        extraToast: 0,
        addMeatballs: false
      };
    });

    function itemTotal(item) {
      const s = state[item.id];
      let t = item.price;
      t += s.extraToast * EXTRA_TOAST_PRICE;
      if (s.addMeatballs) t += MEATBALL_PRICE;
      return t;
    }

    function buildCartItem(item) {
      const s = state[item.id];
      const details = [];
      if (s.sauce) details.push('Sauce: ' + s.sauce);
      if (item.hasMeatballs) details.push('With meatballs');
      if (s.addMeatballs) details.push('+ Meatballs');
      details.push('With garlic toast' + (s.extraToast > 0 ? ` + ${s.extraToast} extra` : ''));
      return {
        id: item.id + '-' + Date.now(),
        type: 'pasta',
        display: item.name,
        name: item.name,
        price: itemTotal(item),
        details
      };
    }

    function addToBox(itemId) {
      const item = ITEMS.find(i => i.id === itemId);
      let box = [];
      try { box = JSON.parse(localStorage.getItem('htp_box') || '[]'); } catch(e) {}
      box.push(buildCartItem(item));
      localStorage.setItem('htp_box', JSON.stringify(box));
      state[itemId].inBox = true;
      renderCard(item);
      updateBadge();
    }

    function removeFromBox(itemId) {
      const item = ITEMS.find(i => i.id === itemId);
      let box = [];
      try { box = JSON.parse(localStorage.getItem('htp_box') || '[]'); } catch(e) {}
      const idx = box.map(b => b.name).lastIndexOf(item.name);
      if (idx > -1) box.splice(idx, 1);
      localStorage.setItem('htp_box', JSON.stringify(box));
      state[itemId] = { inBox:false, sauce: item.sauceSwap ? item.sauceSwap[0] : (item.fixedSauce||null), extraToast:0, addMeatballs:false };
      renderCard(item);
      updateBadge();
    }

    function setSauce(itemId, sauce) {
      state[itemId].sauce = sauce;
      syncCart(itemId);
      renderCard(ITEMS.find(i => i.id === itemId));
    }

    function adjustToast(itemId, delta) {
      state[itemId].extraToast = Math.max(0, state[itemId].extraToast + delta);
      syncCart(itemId);
      renderCard(ITEMS.find(i => i.id === itemId));
    }

    function toggleMeatballs(itemId) {
      state[itemId].addMeatballs = !state[itemId].addMeatballs;
      syncCart(itemId);
      renderCard(ITEMS.find(i => i.id === itemId));
    }

    function syncCart(itemId) {
      if (!state[itemId].inBox) return;
      const item = ITEMS.find(i => i.id === itemId);
      let box = [];
      try { box = JSON.parse(localStorage.getItem('htp_box') || '[]'); } catch(e) {}
      const idx = box.map(b => b.name).lastIndexOf(item.name);
      if (idx > -1) {
        const u = buildCartItem(item);
        box[idx].price = u.price;
        box[idx].details = u.details;
        localStorage.setItem('htp_box', JSON.stringify(box));
      }
    }

    function renderCard(item) {
      const s = state[item.id];
      const card = document.getElementById('card-' + item.id);
      if (!card) return;
      const wasOpen = card.querySelector('.item-options')?.classList.contains('show') || false;
      const inBox = s.inBox;
      const total = itemTotal(item);
      card.className = 'item-card' + (inBox ? ' in-box' : '');

      card.innerHTML = `
        <div class="item-face" id="face-${item.id}">
          <div class="item-info">
            <div class="item-name">${item.name}${item.popular ? '<span class="popular-badge">Popular</span>' : ''}</div>
            <div class="item-desc">${item.desc}</div>
          </div>
          <div class="item-right">
            <div class="item-price">$${total.toFixed(2)}</div>
            ${inBox ? '<span class="add-badge">✓ In Box</span>' : ''}
          </div>
        </div>

        <div class="item-options${(inBox || wasOpen) ? ' show' : ''}" id="opts-${item.id}">

          ${item.sauceSwap ? `
            <div class="opt-label">Sauce</div>
            <div class="choice-row">
              ${item.sauceSwap.map(sc => `
                <button class="choice-btn${s.sauce === sc ? ' active' : ''}"
                  onclick="setSauce('${item.id}', '${sc}')">${sc}</button>
              `).join('')}
            </div>
          ` : item.fixedSauce ? `
            <div class="opt-label">Sauce</div>
            <div class="included-note">${item.fixedSauce} — included</div>
          ` : ''}

          <div class="opt-divider"></div>

          ${item.hasMeatballs ? `
            <div class="addon-row">
              <div class="addon-left">
                <div class="addon-name">Meatballs</div>
                <div class="addon-price">Included</div>
              </div>
              <span class="included-note">✓ 2 beef meatballs</span>
            </div>
          ` : ''}

          ${item.canAddMeatballs ? `
            <div class="addon-row">
              <div class="addon-left">
                <div class="addon-name">Add Meatballs</div>
                <div class="addon-price">+$${MEATBALL_PRICE.toFixed(2)} — 2 beef meatballs</div>
              </div>
              <button class="toggle-btn${s.addMeatballs ? ' active' : ''}"
                onclick="toggleMeatballs('${item.id}')">
                ${s.addMeatballs ? '✓ Added' : '+ Add'}
              </button>
            </div>
          ` : ''}

          <div class="addon-row" style="${item.hasMeatballs || item.canAddMeatballs ? 'border-top:1px solid var(--border);' : ''}">
            <div class="addon-left">
              <div class="addon-name">Extra Garlic Toast</div>
              <div class="addon-price">${s.extraToast === 0 ? '1 included' : `1 included + ${s.extraToast} extra`} · +$${EXTRA_TOAST_PRICE.toFixed(2)} each</div>
            </div>
            <div class="counter">
              <button class="counter-btn" onclick="adjustToast('${item.id}', -1)">−</button>
              <span class="counter-val">${1 + s.extraToast}</span>
              <button class="counter-btn" onclick="adjustToast('${item.id}', 1)">+</button>
            </div>
          </div>

          ${inBox
            ? `<button class="remove-btn" onclick="removeFromBox('${item.id}')">
                <i class="ti ti-x" style="font-size:12px"></i> Remove from Box
               </button>`
            : `<button class="add-btn" onclick="addToBox('${item.id}')">
                <i class="ti ti-circle-plus" style="font-size:14px"></i> Add to Your Box — $${total.toFixed(2)}
               </button>`
          }
        </div>`;

      document.getElementById('face-' + item.id).onclick = () => {
        document.getElementById('opts-' + item.id).classList.toggle('show');
      };
    }

    function updateBadge() {
      try {
        const box = JSON.parse(localStorage.getItem('htp_box') || '[]');
        const badge = document.getElementById('nav-box-badge');
        if (badge) { badge.textContent = box.length; badge.style.display = box.length > 0 ? 'block' : 'none'; }
      } catch(e) {}
    }

    function init() {
      const list = document.getElementById('item-list');
      ITEMS.forEach(item => {
        const div = document.createElement('div');
        div.id = 'card-' + item.id;
        div.className = 'item-card';
        list.appendChild(div);
        renderCard(item);
      });
      updateBadge();
    }

    init();
  </script>
</body>
</html>
