<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#FDF8F3">
  <title>Hot Sandwiches — Hometown Pizza</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <style>
    :root {
      --red: #C8311A; --red-light: #FAECE7; --red-dark: #7A1D0E;
      --cream: #FDF8F3; --dark: #1A1410; --border: #E8DDD6; --muted: #9A8E88;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; background: var(--cream); }
    body { font-family: -apple-system, 'SF Pro Display', 'Helvetica Neue', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }

    .header { position: fixed; top: 0; left: 0; right: 0; z-index: 100; background: var(--cream); border-bottom: 1px solid var(--border); padding: 0 16px; padding-top: var(--safe-top); height: calc(56px + var(--safe-top)); display: flex; align-items: flex-end; justify-content: space-between; padding-bottom: 10px; }
    .back-btn { display: flex; align-items: center; gap: 6px; color: var(--dark); font-size: 15px; font-weight: 600; text-decoration: none; }
    .back-btn i { font-size: 20px; }
    .header-title { font-size: 17px; font-weight: 800; color: var(--dark); letter-spacing: -0.4px; }
    .header-spacer { width: 60px; }

    .page-body { padding-top: calc(56px + var(--safe-top)); padding-bottom: calc(100px + var(--safe-bottom)); }
    .page-eyebrow { font-size: 11px; font-weight: 700; color: var(--red); letter-spacing: 1.8px; text-transform: uppercase; padding: 24px 16px 4px; }
    .page-title { font-size: 26px; font-weight: 800; color: var(--dark); letter-spacing: -0.6px; padding: 0 16px 4px; }
    .page-sub { font-size: 12px; color: var(--muted); padding: 0 16px 16px; }

    .item-list { display: flex; flex-direction: column; gap: 10px; padding: 0 16px; }
    .item-card { background: #fff; border-radius: 14px; border: 1.5px solid var(--border); overflow: hidden; transition: border-color 0.15s; }
    .item-card.in-box { border-color: var(--red); background: var(--red-light); }

    .item-face { display: flex; align-items: center; gap: 12px; padding: 14px 16px; cursor: pointer; min-height: 70px; }
    .item-face:active { opacity: 0.85; }
    .item-info { flex: 1; }
    .item-name { font-size: 15px; font-weight: 700; color: var(--dark); }
    .item-card.in-box .item-name { color: var(--red-dark); }
    .item-desc { font-size: 12px; color: var(--muted); margin-top: 3px; line-height: 1.4; }
    .item-right { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; flex-shrink: 0; }
    .item-price { font-size: 16px; font-weight: 800; color: var(--dark); }
    .item-card.in-box .item-price { color: var(--red); }
    .add-badge { font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 20px; background: var(--red); color: #fff; }
    .popular-badge { font-size: 10px; font-weight: 700; background: var(--red); color: #fff; border-radius: 6px; padding: 2px 7px; margin-left: 7px; vertical-align: middle; }

    .item-options { display: none; padding: 0 14px 14px; border-top: 1px solid var(--border); }
    .item-options.show { display: block; }

    .opt-label { font-size: 10px; font-weight: 700; color: var(--muted); letter-spacing: 1.2px; text-transform: uppercase; margin: 12px 0 8px; }

    /* LTO TOPPINGS */
    .lto-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 4px; }
    .lto-btn { padding: 7px 14px; border-radius: 20px; border: 1.5px solid var(--border); background: #fff; font-size: 13px; font-weight: 600; color: var(--muted); cursor: pointer; font-family: inherit; transition: all 0.15s; display: flex; align-items: center; gap: 5px; }
    .lto-btn.active { background: var(--dark); color: #fff; border-color: var(--dark); }
    .lto-btn:active { opacity: 0.8; }
    .lto-btn i { font-size: 14px; }
    .lto-note { font-size: 11px; color: var(--muted); margin-top: 6px; font-style: italic; }

    /* ADD BTN */
    .add-btn { width: 100%; padding: 12px; border-radius: 12px; border: none; background: var(--red); color: #fff; font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit; margin-top: 12px; display: flex; align-items: center; justify-content: center; gap: 6px; transition: background 0.15s; }
    .add-btn:active { background: var(--red-dark); }
    .remove-btn { width: 100%; padding: 12px; border-radius: 12px; border: 1.5px solid var(--red); background: transparent; color: var(--red); font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit; margin-top: 12px; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .remove-btn:active { background: var(--red-light); }

    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; z-index: 100; background: var(--cream); border-top: 1px solid var(--border); display: flex; align-items: stretch; height: calc(56px + var(--safe-bottom)); padding-bottom: var(--safe-bottom); }
    .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; cursor: pointer; border: none; background: transparent; font-family: inherit; transition: all 0.15s; text-decoration: none; color: var(--muted); padding: 6px 0; }
    .nav-item:active { opacity: 0.7; }
    .nav-item.active { color: var(--red); }
    .nav-item i { font-size: 22px; }
    .nav-label { font-size: 10px; font-weight: 600; letter-spacing: 0.3px; }
    .nav-box-img { width: 26px; height: 26px; object-fit: contain; opacity: 0.5; }
    .nav-badge { position: absolute; top: -3px; right: -5px; background: var(--red); color: #fff; font-size: 9px; font-weight: 800; border-radius: 10px; padding: 2px 4px; min-width: 14px; text-align: center; }
  </style>
</head>
<body>

  <div class="header">
    <a href="index.html#menu" class="back-btn"><i class="ti ti-arrow-left"></i> Menu</a>
    <div class="header-title">Hot Sandwiches</div>
    <div class="header-spacer"></div>
  </div>

  <div class="page-body">
    <div class="page-eyebrow">Served Hot</div>
    <div class="page-title">Hot Sandwiches</div>
    <div class="page-sub">All sandwiches served with baked fries &nbsp;·&nbsp; Lettuce, tomato & onion available upon request</div>
    <div class="item-list" id="item-list"></div>
  </div>

  <nav class="bottom-nav">
    <a href="index.html" class="nav-item"><i class="ti ti-home"></i><span class="nav-label">Home</span></a>
    <a href="index.html#menu" class="nav-item"><i class="ti ti-menu-2"></i><span class="nav-label">Menu</span></a>
    <a href="pizza-box.html" class="nav-item" style="position:relative">
      <div style="position:relative;display:inline-flex">
        <img src="images/Pizza_Box_2-nobg.png" alt="My Box" class="nav-box-img">
        <span class="nav-badge" id="nav-box-badge" style="display:none">0</span>
      </div>
      <span class="nav-label">My Box</span>
    </a>
  </nav>

  <script>
    const ITEMS = [
      {
        id: 'chicken-bacon-ranch',
        name: 'Chicken Bacon Ranch',
        desc: 'Grilled chicken breast, sliced bacon, provolone cheese and ranch dressing.',
        price: 11.99,
        popular: true
      },
      {
        id: 'meatball-sub',
        name: 'Meatball Sub',
        desc: 'Beef meatballs topped with provolone cheese and served with marinara sauce.',
        price: 11.99,
        popular: true
      },
      {
        id: 'philly-chicken',
        name: 'Philly Chicken',
        desc: 'Grilled chicken, mushrooms, onions, green peppers, provolone cheese and honey mustard.',
        price: 11.99,
        popular: true
      },
      {
        id: 'spicy-chicken',
        name: 'Spicy Chicken',
        desc: 'Spicy chicken breast, provolone, sliced pickles and mayo.',
        price: 11.99
      },
      {
        id: 'reuben',
        name: 'Reuben',
        desc: 'Pastrami, sauerkraut and swiss cheese toasted on marble rye bread with 1000 Island on the side.',
        price: 11.99
      },
      {
        id: 'grilled-chicken',
        name: 'Grilled Chicken',
        desc: 'Grilled chicken breast, provolone cheese and honey mustard dressing.',
        price: 11.99
      }
    ];

    const LTO = ['Lettuce', 'Tomato', 'Onion'];

    // State per item
    const state = {};
    ITEMS.forEach(item => {
      state[item.id] = { inBox: false, lto: [] };
    });

    function buildCartItem(item) {
      const s = state[item.id];
      const details = ['With baked fries'];
      if (s.lto.length) details.push(s.lto.join(', '));
      return {
        id: item.id + '-' + Date.now(),
        type: 'sandwich',
        display: item.name,
        name: item.name,
        price: item.price,
        details
      };
    }

    function addToBox(itemId) {
      const item = ITEMS.find(i => i.id === itemId);
      let box = [];
      try { box = JSON.parse(localStorage.getItem('htp_box') || '[]'); } catch(e) {}
      box.push(buildCartItem(item));
      localStorage.setItem('htp_box', JSON.stringify(box));
      state[itemId].inBox = true;
      renderCard(item);
      updateBadge();
    }

    function removeFromBox(itemId) {
      const item = ITEMS.find(i => i.id === itemId);
      let box = [];
      try { box = JSON.parse(localStorage.getItem('htp_box') || '[]'); } catch(e) {}
      const idx = box.map(b => b.name).lastIndexOf(item.name);
      if (idx > -1) box.splice(idx, 1);
      localStorage.setItem('htp_box', JSON.stringify(box));
      state[itemId].inBox = false;
      state[itemId].lto = [];
      renderCard(item);
      updateBadge();
    }

    function toggleLTO(itemId, topping) {
      const s = state[itemId];
      const idx = s.lto.indexOf(topping);
      if (idx > -1) s.lto.splice(idx, 1);
      else s.lto.push(topping);
      const item = ITEMS.find(i => i.id === itemId);
      // Update cart if already in box
      if (s.inBox) {
        let box = [];
        try { box = JSON.parse(localStorage.getItem('htp_box') || '[]'); } catch(e) {}
        const bi = box.map(b => b.name).lastIndexOf(item.name);
        if (bi > -1) {
          box[bi].details = ['With baked fries'];
          if (s.lto.length) box[bi].details.push(s.lto.join(', '));
          localStorage.setItem('htp_box', JSON.stringify(box));
        }
      }
      renderCard(item);
    }

    function renderCard(item) {
      const s = state[item.id];
      const card = document.getElementById('card-' + item.id);
      if (!card) return;
      const wasOpen = card.querySelector('.item-options')?.classList.contains('show') || false;
      const inBox = s.inBox;
      card.className = 'item-card' + (inBox ? ' in-box' : '');

      card.innerHTML = `
        <div class="item-face" id="face-${item.id}">
          <div class="item-info">
            <div class="item-name">${item.name}${item.popular ? '<span class="popular-badge">Popular</span>' : ''}</div>
            <div class="item-desc">${item.desc}</div>
          </div>
          <div class="item-right">
            <div class="item-price">$${item.price.toFixed(2)}</div>
            ${inBox ? '<span class="add-badge">✓ In Box</span>' : ''}
          </div>
        </div>

        <div class="item-options${(inBox || wasOpen) ? ' show' : ''}" id="opts-${item.id}">
          <div class="opt-label">Add to your sandwich</div>
          <div class="lto-row">
            ${LTO.map(t => `
              <button class="lto-btn${s.lto.includes(t) ? ' active' : ''}"
                onclick="toggleLTO('${item.id}', '${t}')">
                ${s.lto.includes(t) ? '<i class="ti ti-check"></i>' : '<i class="ti ti-plus"></i>'}
                ${t}
              </button>`).join('')}
          </div>
          <div class="lto-note">Served upon request — no extra charge</div>
          ${inBox
            ? `<button class="remove-btn" onclick="removeFromBox('${item.id}')">
                <i class="ti ti-x" style="font-size:12px"></i> Remove from Box
               </button>`
            : `<button class="add-btn" onclick="addToBox('${item.id}')">
                <i class="ti ti-circle-plus" style="font-size:14px"></i> Add to Your Box — $${item.price.toFixed(2)}
               </button>`
          }
        </div>`;

      document.getElementById('face-' + item.id).onclick = () => {
        document.getElementById('opts-' + item.id).classList.toggle('show');
      };
    }

    function updateBadge() {
      try {
        const box = JSON.parse(localStorage.getItem('htp_box') || '[]');
        const badge = document.getElementById('nav-box-badge');
        if (badge) { badge.textContent = box.length; badge.style.display = box.length > 0 ? 'block' : 'none'; }
      } catch(e) {}
    }

    function init() {
      const list = document.getElementById('item-list');
      ITEMS.forEach(item => {
        const div = document.createElement('div');
        div.id = 'card-' + item.id;
        div.className = 'item-card';
        list.appendChild(div);
        renderCard(item);
      });
      updateBadge();
    }

    init();
  </script>
</body>
</html>
